[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-rag-opencode"
version = "0.1.0"
description = "MCP RAG server para opencode"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.12.*",
    "qdrant-client",
    "httpx",
    "python-dotenv",
]

[project.scripts]
mcp-rag-opencode = "mcp_rag.server:main"

[tool.setuptools.packages.find]
include = ["mcp_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
